name: Build Beetle WSwan (Android armeabi-v7a, Xperia Play)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK: ${{ github.workspace }}/android-ndk-r23c

    steps:
      - uses: actions/checkout@v7

      - name: Cache NDK r23c
        id: ndk
        uses: actions/cache@v6
        with:
          path: android-ndk-r23c
          key: ndk-r23c-linux

      - name: Download NDK r23c
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          unzip -q ndk.zip

      - name: Build
        working-directory: jni
        run: |
          # Xperia Play: ARMv7-A, NEON, softfp, API 16 (works on 4.0.4)
          OPT="-O3 -flto -mcpu=cortex-a8 -mfpu=neon -mfloat-abi=softfp \
          -ffast-math -fomit-frame-pointer -funroll-loops -fno-stack-protector \
          -fvectorize -fslp-vectorize -fmerge-all-constants -fno-common \
          -ffunction-sections -fdata-sections -fvisibility=hidden -DNDEBUG"
          LDOPT="-flto -Wl,--gc-sections -Wl,-O2 -Wl,--as-needed -Wl,--icf=all -Wl,--exclude-libs,ALL"

          "$NDK/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk \
            APP_ABI=armeabi-v7a \
            APP_PLATFORM=android-16 \
            APP_STL=c++_static \
            APP_ARM_NEON=true \
            APP_OPTIM=release \
            APP_CFLAGS="$OPT" \
            APP_CPPFLAGS="$OPT" \
            APP_LDFLAGS="$LDOPT" \
            DEBUG=0

          cp libs/armeabi-v7a/libretro.so mednafen_wswan_libretro_android.so

      - uses: actions/upload-artifact@v7
        with:
          name: mednafen_wswan_libretro_android
          path: jni/mednafen_wswan_libretro_android.so
